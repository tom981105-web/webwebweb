    <script>
        function safeParse(value, fallback) {
            try {
                return JSON.parse(value);
            } catch (error) {
                return fallback;
            }
        }

        function getApiBase() {
            if (window.location.protocol === 'file:') {
                return 'http://localhost:3000';
            }
            return '';
        }

        function getApiUrl(path) {
            return getApiBase() + path;
        }

        async function retryFetchJson(path, attempts = 4, delayMs = 300) {
            let lastError = null;
            for (let attempt = 0; attempt < attempts; attempt += 1) {
                try {
                    const response = await fetch(getApiUrl(path), { cache: 'no-store' });
                    const result = await response.json().catch(() => ({}));
                    if (response.ok) return result;
                    lastError = new Error(result.message || '?붿껌???ㅽ뙣?덉뒿?덈떎.');
                } catch (error) {
                    lastError = error;
                }
                if (attempt < attempts - 1) {
                    await new Promise((resolve) => setTimeout(resolve, delayMs));
                }
            }
            throw lastError || new Error('?붿껌???ㅽ뙣?덉뒿?덈떎.');
        }

        function getUsersDbLocal() {
            return safeParse(localStorage.getItem('users_db') || '{}', {});
        }

        function formatPostDate(dateString) {
            if (!dateString) return '-';
            const rawValue = String(dateString).trim();
            const normalizedValue = rawValue.includes('T') ? rawValue : rawValue.replace(' ', 'T');
            const parsedDate = new Date(normalizedValue);

            if (!Number.isNaN(parsedDate.getTime())) {
                const now = new Date();
                const isToday = parsedDate.getFullYear() === now.getFullYear()
                    && parsedDate.getMonth() === now.getMonth()
                    && parsedDate.getDate() === now.getDate();

                if (isToday) {
                    return parsedDate.toLocaleTimeString('ko-KR', {
                        hour: '2-digit',
                        minute: '2-digit',
                        hour12: false
                    });
                }

                return parsedDate.toLocaleDateString('ko-KR', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                }).replace(/\.\s?/g, '-').replace(/-$/, '');
            }

            const [datePart, timePart] = rawValue.split(' ');
            const today = new Date().toISOString().split('T')[0];
            if (datePart === today && timePart) return timePart.slice(0, 5);
            return datePart || rawValue;
        }

        function getCommentCount(post) {
            if (!Array.isArray(post.comments)) return 0;
            return post.comments.reduce((total, comment) => total + 1 + (comment.reply ? 1 : 0), 0, 0);
        }

        function normalizeStoredImage(url) {
            const value = String(url || '').trim();
            if (!value) return '';
            if (value.startsWith('data:image/')) return value;
            const localhostUploadMatch = value.match(/^https?:\/\/localhost:\d+(\/uploads\/.+)$/i);
            if (localhostUploadMatch) return localhostUploadMatch[1];
            if (/^\/uploads\//i.test(value)) return value;
            return value;
        }

        function getDisplayName(authorId) {
            const users = getUsersDbLocal();
            const author = (authorId || '').trim();
            return users[author] && users[author].nickname ? users[author].nickname : author || '?듬챸';
        }

        async function renderRecentPosts() {
            const postsList = document.getElementById('recentPostsList');
            let posts = [];

            try {
                const result = await retryFetchJson('/api/board/posts');
                if (Array.isArray(result.posts)) {
                    posts = result.posts;
                }
            } catch (error) {
            }

            if (!Array.isArray(posts) || posts.length === 0) {
                postsList.innerHTML = '<div style="padding:20px 0; color:#6f5a47; text-align:center;">理쒓렐 ?깅줉??寃뚯떆湲???놁뒿?덈떎. 泥?湲???④꺼蹂댁꽭??</div>';
                return;
            }

            const sorted = [...posts].sort((a, b) => {
                if (a.isNotice && !b.isNotice) return -1;
                if (!a.isNotice && b.isNotice) return 1;
                return (b.id || 0) - (a.id || 0);
            }).slice(0, 5);

            postsList.innerHTML = '';
            sorted.forEach((post) => {
                const isNotice = Boolean(post.isNotice);
                const isHot = Number(post.likes || 0) >= 10 && !isNotice;
                const commentCount = getCommentCount(post);
                const comments = commentCount > 0 ? `<span style="color:#9f4f2e; font-size:0.85rem; margin-left:6px; font-weight:700;">[${commentCount}]</span>` : '';
                const tagText = isNotice ? '怨듭?' : (isHot ? '?멸린' : '?먯쑀');
                const item = document.createElement('div');
                item.className = 'post-item';
                item.innerHTML = `
                    <span class="post-tag">${tagText}</span>
                    <a href="board.html?id=${post.id}" class="post-title">${post.title || '?쒕ぉ ?놁쓬'}${comments}</a>
                    <span class="post-date"><span style="color:#8f755d; margin-right:8px;">${getDisplayName(post.author)}</span>${formatPostDate(post.date)}</span>
                `;
                postsList.appendChild(item);
            });
        }

        function escapeRecentHtml(value) {
            return String(value || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function getRecentItemTimestamp(value, fallback = 0) {
            if (!value) return fallback;
            const parsed = Date.parse(String(value).replace(' ', 'T'));
            return Number.isFinite(parsed) ? parsed : fallback;
        }

        function formatRecentDateLabel(value) {
            if (!value) return '-';
            return formatPostDate(String(value).replace('T', ' '));
        }

        async function renderRecentPosts() {
            const postsList = document.getElementById('recentPostsList');
            let boardPosts = [];
            let mountainPosts = [];
            let aiPrompts = [];

            try {
                const result = await retryFetchJson('/api/board/posts');
                if (Array.isArray(result.posts)) boardPosts = result.posts;
            } catch (error) {
            }

            try {
                const result = await retryFetchJson('/api/mountains');
                if (Array.isArray(result.mountains)) mountainPosts = result.mountains;
            } catch (error) {
            }

            try {
                const result = await retryFetchJson('/api/ai/prompts');
                if (Array.isArray(result.prompts)) aiPrompts = result.prompts;
            } catch (error) {
            }

            const feedItems = [];

            boardPosts.forEach((post) => {
                const commentCount = getCommentCount(post);
                feedItems.push({
                    type: post.isNotice ? '怨듭?' : ((Number(post.likes || 0) >= 10) ? '?멸린' : '?먯쑀'),
                    title: post.title || '?쒕ぉ ?놁쓬',
                    author: getDisplayName(post.author),
                    dateLabel: formatRecentDateLabel(post.date),
                    href: `board.html?id=${post.id}`,
                    extraHtml: commentCount > 0 ? `<span style="color:#9f4f2e; font-size:0.85rem; margin-left:6px; font-weight:700;">[${commentCount}]</span>` : '',
                    sortKey: getRecentItemTimestamp(post.date, Number(post.id || 0))
                });
            });

            mountainPosts.forEach((mountain) => {
                feedItems.push({
                    type: '?고뻾',
                    title: mountain.title || mountain.name || '?고뻾 湲곕줉',
                    author: getDisplayName(mountain.author),
                    dateLabel: formatRecentDateLabel(mountain.updatedAt || mountain.createdAt || mountain.date),
                    href: `mountain.html?id=${encodeURIComponent(mountain.id)}`,
                    extraHtml: '',
                    sortKey: getRecentItemTimestamp(mountain.updatedAt || mountain.createdAt || mountain.date, 0)
                });
            });

            aiPrompts.forEach((prompt) => {
                feedItems.push({
                    type: 'AI',
                    title: prompt.title || '?꾨＼?꾪듃',
                    author: getDisplayName(prompt.author),
                    dateLabel: formatRecentDateLabel(prompt.updatedAt || prompt.createdAt || ''),
                    href: `ai.html?prompt=${encodeURIComponent(prompt.id)}`,
                    extraHtml: '',
                    sortKey: getRecentItemTimestamp(prompt.updatedAt || prompt.createdAt || '', Number(prompt.id || 0))
                });
            });

            if (!feedItems.length) {
                postsList.innerHTML = '<div style="padding:20px 0; color:#6f5a47; text-align:center;">筌ㅼ뮄???源낆쨯??野껊슣?녷묾?????곷뮸??덈뼄. 筌?疫꼲????ｊ볼癰귣똻苑??</div>';
                return;
            }

            const sorted = feedItems.sort((a, b) => b.sortKey - a.sortKey).slice(0, 5);
            postsList.innerHTML = '';
            sorted.forEach((entry) => {
                const item = document.createElement('div');
                item.className = 'post-item';
                const tagClass = `post-tag post-tag-${String(entry.type || '').toLowerCase()}`;
                item.innerHTML = `
                    <span class="${tagClass}">${escapeRecentHtml(entry.type)}</span>
                    <a href="${entry.href}" class="post-title">${escapeRecentHtml(entry.title)}${entry.extraHtml}</a>
                    <span class="post-date"><span style="color:#8f755d; margin-right:8px;">${escapeRecentHtml(entry.author)}</span>${escapeRecentHtml(entry.dateLabel)}</span>
                `;
                postsList.appendChild(item);
            });
        }

        function getBannerState() {
            const defaults = {
                top: { title: '?곕━?ㅼ쓽 ?꾩???, desc: '?곕━?쇰━ 紐⑥뿬 ?먯쑀濡?쾶 ?댁빞湲고븯??怨듦컙', bg: '' },
                left: { url: '', link: '#' },
                right: { url: '', link: '#' }
            };
            const saved = safeParse(localStorage.getItem('site_banners') || '{}', {});
            return {
                top: { ...defaults.top, posX: 4, posY: 50, ...(saved.top || {}), bg: normalizeStoredImage(saved.top && saved.top.bg) },
                left: { ...defaults.left, ...(saved.left || {}), url: normalizeStoredImage(saved.left && saved.left.url) },
                right: { ...defaults.right, ...(saved.right || {}), url: normalizeStoredImage(saved.right && saved.right.url) }
            };
        }

        function setSideBanner(id, data) {
            const el = document.getElementById(id);
            if (!el) return;
            if (data && data.url) {
                el.innerHTML = `<a href="${data.link || '#'}" target="_blank" rel="noopener noreferrer"><img src="${data.url}" alt="banner"></a>`;
                el.style.display = 'block';
            } else {
                el.innerHTML = '';
                el.style.display = 'none';
            }
        }

        function applyBanners() {
            const banners = getBannerState();
            document.getElementById('bannerTitle').innerText = banners.top.title || '?곕━?ㅼ쓽 ?꾩???;
            document.getElementById('bannerDesc').innerText = banners.top.desc || '?곕━?쇰━ 紐⑥뿬 ?먯쑀濡?쾶 ?댁빞湲고븯??怨듦컙';

            const bannerEl = document.getElementById('mainBanner');
            if (banners.top.bg) {
                bannerEl.style.backgroundImage = `url('${banners.top.bg}')`;
            } else {
                bannerEl.style.backgroundImage = "linear-gradient(135deg, rgba(120, 87, 54, 0.25), rgba(47, 29, 15, 0.1)), url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1600&auto=format&fit=crop')";
            }

            const contentEl = bannerEl.querySelector('.banner-content');
            if (contentEl && banners.top.posX !== undefined && banners.top.posY !== undefined) {
                contentEl.style.position = 'absolute';
                contentEl.style.left = banners.top.posX + '%';
                contentEl.style.top = banners.top.posY + '%';
                contentEl.style.transform = 'translate(-50%, -50%)';
                contentEl.style.textAlign = 'left';
            } else if (contentEl) {
                contentEl.style.position = 'relative';
                contentEl.style.left = '';
                contentEl.style.top = '';
                contentEl.style.transform = '';
                contentEl.style.textAlign = '';
            }

            setSideBanner('leftBanner', banners.left);
            setSideBanner('rightBanner', banners.right);
        }

        function applyMenuIcons() {
            const menuIcons = safeParse(localStorage.getItem('menu_icons') || '{}', {});
            const cards = document.querySelectorAll('.menu-card');
            const keys = ['mountain', 'ai', 'board'];

            keys.forEach((key, index) => {
                const icon = menuIcons[key];
                if (!icon || !cards[index]) return;
                const target = cards[index].querySelector('.card-icon');
                if (!target) return;
                target.innerHTML = String(icon).startsWith('data:')
                    ? `<img src="${icon}" style="width:100%; height:100%; object-fit:cover;">`
                    : icon;
            });
        }

        function getStockSimUrl() {
            const apiBase = getApiBase();
            return apiBase ? `${apiBase}/stock-sim-app/` : 'stock-sim-app/';
        }

        function canAccessStockSim() {
            const currentUser = String(localStorage.getItem('current_user') || '').trim();
            if (!currentUser) return false;

            const users = safeParse(localStorage.getItem('users_db') || '{}', {});
            const matchedUserId = Object.keys(users).find((entry) => entry.toLowerCase() === currentUser.toLowerCase());
            const user = matchedUserId ? users[matchedUserId] : null;
            return Boolean(user && (user.isAdmin || String(user.status || '').toLowerCase() === 'regular'));
        }

        function updateStockSimCardState() {
            const card = document.getElementById('stockSimCard');
            const desc = document.getElementById('stockSimCardDesc');
            if (!card || !desc) return;

            const icon = card.querySelector('.card-icon');
            const title = card.querySelector('h3');
            const isAllowed = canAccessStockSim();

            if (icon) icon.textContent = '주식';
            if (title) title.textContent = '주식장';

            card.classList.toggle('disabled', !isAllowed);
            card.setAttribute('aria-disabled', isAllowed ? 'false' : 'true');
            desc.textContent = isAllowed
                ? '03월 30일~03월 31일까지 진행하는 프로토타입입니다.'
                : '03월 30일~03월 31일까지 진행하는 프로토타입입니다. 승인된 회원만 입장할 수 있습니다.';
        }

        function openStockSimPage(event) {
            if (event) event.preventDefault();
            const currentUser = String(localStorage.getItem('current_user') || '').trim();

            if (!currentUser) {
                window.location.href = 'login.html';
                return;
            }

            if (!canAccessStockSim()) {
                alert('승인된 회원만 주식장에 입장할 수 있습니다. 관리자 승인 후 다시 시도해 주세요.');
                return;
            }

            window.location.href = getStockSimUrl();
        }

        window.openStockSimPage = openStockSimPage;

        document.addEventListener('DOMContentLoaded', () => {
            renderRecentPosts();
            applyBanners();
            applyMenuIcons();
            updateStockSimCardState();
        });

        window.addEventListener('sync:initial-complete', () => {
            renderRecentPosts();
            updateStockSimCardState();
        });

        window.addEventListener('auth:login-success', updateStockSimCardState);
    </script>
